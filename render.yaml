services:
  - type: web
    name: aegisguard-fraud-detection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Add your secrets in the Render dashboard, not here:
      # DATABASE_URL, API keys, etc. (sync: false means "set it manually")
      - key: DATABASE_URL
        sync: false
